<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://kanavuillam.in/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanavu Illam - Workflow Architecture (Globe Express Luxury Slider)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary-gold: #ffd043;
      --accent-gold: #ffb703;
      --deep-forest: #0d1a12;
      --sage-glow: rgba(140, 163, 143, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060c08;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
    }

    .font-serif-luxury {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* ========================================================================= */
    /* GLOBE EXPRESS LUXURY SPLIT SLIDER                                         */
    /* ========================================================================= */
    .globe-slider-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #060c08;
    }

    /* 1. Full-Bleed Active Hero Background Stage */
    .bg-stage-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-slide-item {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 2.8s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      will-change: opacity, transform;
      z-index: 1;
    }

    .bg-slide-item.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      z-index: 3;
    }

    .bg-slide-item.prev-active {
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 2;
    }

    .bg-slide-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: contrast(1.04) saturate(1.08);
      image-rendering: high-quality;
    }

    /* Studio Vignette: Darkens behind text and cards to isolate floating cards */
    .bg-slide-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(90deg, 
          rgba(6, 12, 8, 0.94) 0%, 
          rgba(6, 12, 8, 0.74) 34%, 
          rgba(6, 12, 8, 0.3) 55%, 
          rgba(6, 12, 8, 0.75) 78%, 
          rgba(6, 12, 8, 0.96) 100%),
        linear-gradient(180deg, 
          rgba(5, 10, 7, 0.65) 0%, 
          transparent 20%, 
          transparent 65%, 
          rgba(5, 10, 7, 0.95) 100%);
      pointer-events: none;
    }

    /* ========================================================================= */
    /* 2. CARD-TO-BACKGROUND EXPANSION MORPH PORTAL (THE VIDEO SIGNATURE EFFECT) */
    /* ========================================================================= */
    .card-morph-portal {
      position: fixed;
      z-index: 15; /* Above background, behind main stage content */
      overflow: hidden;
      will-change: top, left, width, height, border-radius, box-shadow;
      pointer-events: none;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85);
    }

    .card-morph-portal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: contrast(1.04) saturate(1.08);
    }

    .card-morph-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(90deg, 
          rgba(6, 12, 8, 0.94) 0%, 
          rgba(6, 12, 8, 0.74) 34%, 
          rgba(6, 12, 8, 0.3) 55%, 
          rgba(6, 12, 8, 0.75) 78%, 
          rgba(6, 12, 8, 0.96) 100%),
        linear-gradient(180deg, 
          rgba(5, 10, 7, 0.65) 0%, 
          transparent 20%, 
          transparent 65%, 
          rgba(5, 10, 7, 0.95) 100%);
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .card-morph-portal.expanded .card-morph-overlay {
      opacity: 1;
    }

    /* 3. Top Universal Brand Bar */
    .globe-top-bar {
      position: relative;
      z-index: 40;
      width: 100%;
      height: 60px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(6, 12, 8, 0.8) 0%, transparent 100%);
    }

    @media (min-width: 1024px) {
      .globe-top-bar {
        padding: 0 4.5rem;
        height: 68px;
      }
    }

    /* 4. Main Split Stage: Left Editorial + Right Edge-Bleeding Deck */
    .globe-main-stage {
      position: relative;
      z-index: 30;
      width: 100%;
      margin: 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: center;
      flex: 1 1 auto;
      overflow: visible;
    }

    @media (min-width: 1024px) {
      .globe-main-stage {
        grid-template-columns: minmax(380px, 480px) 1fr;
        padding-left: 4.5rem;
        padding-right: 0; /* Bleed cards directly to the right viewport edge */
        gap: 3.5rem;
        align-items: center;
      }

      /* Card deck aligned towards bottom right (Exact Video Layout) */
      .card-deck-viewport {
        align-self: flex-end;
        padding-bottom: 2rem;
        transform: translateY(24px);
      }
    }

    /* Left Editorial Typography Mask Animation */
    .text-mask-wrapper {
      overflow: hidden;
      display: block;
    }

    .masked-line {
      display: block;
      will-change: transform, opacity;
      transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 5. Right Floating Card Deck: Tall, Elegant Squircle Posters (Video Style) */
    .card-deck-viewport {
      position: relative;
      width: 100%;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      padding-right: 2rem;
      z-index: 20;
    }

    .card-deck-track {
      display: flex;
      gap: 1.5rem;
      transition: transform 1.05s cubic-bezier(0.2, 1, 0.28, 1);
      will-change: transform;
      padding: 1rem 0.5rem 1.5rem 0;
    }

    /* Squircle Poster Card (Exact Video Proportions) */
    .deck-poster-card {
      flex: 0 0 200px;
      height: 310px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      background: #0d1710;
      box-shadow: 
        0 18px 40px -10px rgba(0, 0, 0, 0.75),
        0 4px 12px rgba(0, 0, 0, 0.5),
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.4s ease,
                  box-shadow 0.45s ease,
                  opacity 0.35s ease;
      will-change: transform, box-shadow, opacity;
    }

    @media (min-width: 640px) {
      .deck-poster-card {
        flex: 0 0 220px;
        height: 340px;
        border-radius: 24px;
      }
    }

    @media (min-width: 1280px) {
      .deck-poster-card {
        flex: 0 0 240px;
        height: 365px;
        border-radius: 26px;
      }
    }

    .deck-poster-card:hover {
      transform: translateY(-8px) scale(1.025);
      border-color: rgba(255, 208, 67, 0.95);
      box-shadow: 
        0 24px 50px -10px rgba(0, 0, 0, 0.85),
        0 0 25px rgba(255, 208, 67, 0.35),
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.8);
    }

    .deck-poster-card.card-active-expanding {
      transform: translateY(-12px) scale(1.05);
      border-color: #ffd043;
      box-shadow: 0 0 35px rgba(255, 208, 67, 0.65), inset 0 2px 3px rgba(255, 255, 255, 0.9);
    }

    .deck-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .deck-poster-card:hover .deck-card-img {
      transform: scale(1.05);
    }

    /* Glass Sheen at top-left */
    .deck-glass-sheen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 35%, transparent 65%);
      pointer-events: none;
      z-index: 5;
      border-radius: 24px 24px 60px 0;
    }

    /* Bottom Dark Gradient for Poster Typography (Video Style) */
    .deck-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, 
        transparent 0%, 
        transparent 45%, 
        rgba(8, 15, 11, 0.72) 72%, 
        rgba(5, 10, 7, 0.96) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.35rem 1.15rem;
      z-index: 6;
      border-radius: inherit;
    }

    /* 6. Bottom Controls Bar: Minimal Circular Arrows + Pills + Giant Step Counter */
    .globe-controls-bar {
      position: relative;
      z-index: 35;
      width: 100%;
      height: 64px;
      padding: 0 1.5rem 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .globe-controls-bar {
        padding: 0 4.5rem 0.95rem 4.5rem;
        height: 70px;
      }
    }

    /* Minimal Circular Navigation Arrows (Video Style) */
    .nav-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-circle-btn:hover {
      background: #ffd043;
      color: #060c08;
      border-color: #ffd043;
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 208, 67, 0.5);
    }

    .progress-pill-dot {
      height: 5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .progress-pill-dot.active {
      width: 26px;
      background: #ffd043;
      box-shadow: 0 0 10px rgba(255, 208, 67, 0.55);
    }

    .progress-pill-dot:not(.active) {
      width: 7px;
    }

    .progress-pill-dot:hover:not(.active) {
      background: rgba(255, 255, 255, 0.7);
    }

    .counter-display {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      will-change: opacity, transform;
    }

    .autoplay-timer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #ffd043, #ffb703);
      width: 0%;
      z-index: 50;
      transition: width 0.05s linear;
    }
  </style>
</head>

<body>

  <!-- ========================================================================= -->
  <!-- GLOBE EXPRESS LUXURY SPLIT SLIDER                                         -->
  <!-- ========================================================================= -->
  <div id="globeSliderSection" class="globe-slider-wrapper">

    <!-- Autoplay Timer Bar along bottom edge -->
    <div id="autoplayProgress" class="autoplay-timer-bar"></div>

    <!-- 1. FULL-BLEED ACTIVE HERO BACKGROUND STAGE -->
    <div class="bg-stage-container" id="bgStageContainer">
      <div class="bg-slide-item active" data-index="0">
        <img src="assets/step1.png" alt="Upload 2D Plan">
        <div class="bg-slide-overlay"></div>
      </div>
      <div class="bg-slide-item" data-index="1">
        <img src="assets/step2.png" alt="Secure Payment">
        <div class="bg-slide-overlay"></div>
      </div>
      <div class="bg-slide-item" data-index="2">
        <img src="assets/step3.png" alt="Analyze 2D Plan">
        <div class="bg-slide-overlay"></div>
      </div>
      <div class="bg-slide-item" data-index="3">
        <img src="assets/step4.png" alt="View Reports">
        <div class="bg-slide-overlay"></div>
      </div>
      <div class="bg-slide-item" data-index="4">
        <img src="assets/step5.png" alt="Download Reports">
        <div class="bg-slide-overlay"></div>
      </div>
    </div>

    <!-- 2. CARD-TO-BACKGROUND EXPANSION MORPH PORTAL -->
    <div id="cardMorphPortal" class="card-morph-portal" style="display: none;">
      <img id="cardMorphImg" src="" alt="Morphing Card">
      <div class="card-morph-overlay"></div>
    </div>

    <!-- 3. TOP BRAND HEADER -->
    <header class="globe-top-bar">
      <a href="index.html" class="flex items-center gap-2.5 text-white group">
        <div
          class="w-8 h-8 rounded-xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center p-1.5 shadow-md group-hover:scale-105 transition-transform">
          <img src="assets/app_logo.png" alt="Kanavu Illam Logo" class="w-full h-full object-contain">
        </div>
        <span class="font-serif-luxury text-lg sm:text-xl font-bold tracking-tight text-white">
          Kanavu <span class="text-[#ffd043]">illam</span>
        </span>
      </a>
    </header>

    <!-- 4. MAIN SPLIT SCREEN: LEFT EDITORIAL INFO + RIGHT EDGE-BLEEDING CARD TRACK -->
    <main class="globe-main-stage">

      <!-- LEFT COLUMN: Pure Editorial Typography with Mask Reveal -->
      <div class="flex flex-col justify-center text-left max-w-lg z-20">

        <!-- Masked Headline Title Line 1 -->
        <div class="text-mask-wrapper mb-1">
          <h1
            id="activeTitleLine1"
            class="masked-line font-serif-luxury text-2xl sm:text-3xl lg:text-[36px] font-bold text-white leading-tight tracking-tight">
            Upload 2D Plan
          </h1>
        </div>

        <!-- Masked Headline Subtitle Line 2 -->
        <div class="text-mask-wrapper mb-3">
          <span
            id="activeTitleLine2"
            class="masked-line italic font-serif-luxury font-normal text-[#ffd043] text-xl sm:text-2xl lg:text-[26px]">
            In One Click
          </span>
        </div>

        <!-- Masked Concise Description -->
        <div class="text-mask-wrapper">
          <p
            id="activeDescription"
            class="masked-line text-xs sm:text-[13px] text-white/85 leading-relaxed font-normal max-w-md drop-shadow-sm">
            Add your 2D sketch, blueprint, png, jpg, or technical PDF drawing. Our deterministic AI parser extracts walls, room boundaries, and loads in seconds.
          </p>
        </div>

      </div>

      <!-- RIGHT COLUMN: Continuous Horizontal Card Track (Moved to Bottom Right) -->
      <div class="card-deck-viewport">
        <!-- Horizontal Continuous Track: Slides smoothly in synchronization with morph -->
        <div class="card-deck-track" id="cardDeckTrack">
          <!-- Populated dynamically with cards -->
        </div>
      </div>

    </main>

    <!-- 5. BOTTOM CONTROLS BAR: GIANT LUXURY STEP COUNTER -->
    <footer class="globe-controls-bar flex items-center justify-end">

      <!-- Right: Giant Luxury Step Counter (01 / 05) -->
      <div class="flex items-baseline gap-1 text-right select-none ml-auto">
        <span id="giantCounterNum" class="counter-display text-3xl sm:text-4xl lg:text-5xl text-white drop-shadow-md">
          01
        </span>
        <span class="font-mono text-xs sm:text-sm font-bold text-white/40">
          / 05
        </span>
      </div>

    </footer>

  </div>


  <!-- ========================================================================= -->
  <!-- JAVASCRIPT: CARD EXPANSION MORPH ENGINE                                   -->
  <!-- ========================================================================= -->
  <script>
    (function initGlobeExpressLuxurySlider() {
      const workflowData = [
        {
          id: 0,
          stepNum: '01',
          titleLine1: 'Upload 2D Plan',
          titleLine2: 'In One Click',
          desc: 'Add your 2D sketch, blueprint, png, jpg, or technical PDF drawing. Our deterministic AI parser extracts walls, room boundaries, and loads in seconds.',
          image: 'assets/step1.png',
          cardCategory: 'SUBMISSION',
          cardTitle: 'Upload 2D Plan',
          cardSubtitle: 'Blueprint & Sketches'
        },
        {
          id: 1,
          stepNum: '02',
          titleLine1: 'Secure Payment',
          titleLine2: 'Instant Receipt & Access',
          desc: 'Transparent pricing with flexible packages to suit your exact needs. 100% encrypted checkout with instant invoice generation and guaranteed privacy.',
          image: 'assets/step2.png',
          cardCategory: 'VERIFICATION',
          cardTitle: 'Secure Payment',
          cardSubtitle: 'Instant Receipt'
        },
        {
          id: 2,
          stepNum: '03',
          titleLine1: 'Analyze 2D Plan',
          titleLine2: 'Vāstu Energy Grid',
          desc: 'Deterministic parsing of load-bearing walls, structural columns, and 16-zone Vedic energy grid. Validated against Indian Standard IS 456 safety codes.',
          image: 'assets/step3.png',
          cardCategory: 'AI ANALYSIS',
          cardTitle: 'Analyze 2D Plan',
          cardSubtitle: 'Vāstu & Structural'
        },
        {
          id: 3,
          stepNum: '04',
          titleLine1: 'View Reports',
          titleLine2: 'Spatial Walkthrough',
          desc: 'Immerse yourself in interactive 3D spatial models, elevation cross-sections, daylight simulations, and material quantity takeoff schedules.',
          image: 'assets/step4.png',
          cardCategory: '3D WALKTHROUGH',
          cardTitle: 'View Reports',
          cardSubtitle: 'Spatial Walkthrough'
        },
        {
          id: 4,
          stepNum: '05',
          titleLine1: 'Download Reports',
          titleLine2: 'Certified PDF Dossier',
          desc: 'Download all certified engineering reports in one single click. Municipality-ready structural drawings and permanent digital archive for your device.',
          image: 'assets/step5.png',
          cardCategory: 'FINAL DOSSIER',
          cardTitle: 'Download Reports',
          cardSubtitle: 'Certified PDF'
        }
      ];

      const total = workflowData.length;
      let currentIndex = 0;
      let virtualTrackIndex = 0;
      let isTransitioning = false;
      let isAutoplayRunning = true;
      let progressInterval = null;
      let progressPercent = 0;
      const AUTOPLAY_DURATION = 6000;

      // DOM Elements
      const bgSlides = document.querySelectorAll('.bg-slide-item');
      const cardMorphPortal = document.getElementById('cardMorphPortal');
      const cardMorphImg = document.getElementById('cardMorphImg');
      const activeTitleLine1 = document.getElementById('activeTitleLine1');
      const activeTitleLine2 = document.getElementById('activeTitleLine2');
      const activeDescription = document.getElementById('activeDescription');
      const cardDeckTrack = document.getElementById('cardDeckTrack');
      const giantCounterNum = document.getElementById('giantCounterNum');
      const progressPillsContainer = document.getElementById('progressPillsContainer');
      const autoplayProgressBar = document.getElementById('autoplayProgress');
      const prevSlideBtn = document.getElementById('prevSlideBtn');
      const nextSlideBtn = document.getElementById('nextSlideBtn');

      // 1. Build Continuous Track (Triple duplicated array: 15 cards for infinite smooth conveyor glide)
      const REPEATS = 3;
      function buildContinuousTrack() {
        cardDeckTrack.innerHTML = '';
        for (let r = 0; r < REPEATS; r++) {
          workflowData.forEach((data, stepIdx) => {
            const card = document.createElement('div');
            card.className = 'deck-poster-card';
            card.setAttribute('data-step-index', stepIdx);
            card.setAttribute('data-card-id', `${r}-${stepIdx}`);

            card.innerHTML = `
              <div class="deck-glass-sheen"></div>
              <img src="${data.image}" alt="${data.cardTitle}" class="deck-card-img">
              <div class="deck-card-overlay">
                <div class="mt-auto">
                  <span class="text-[9.5px] font-mono font-bold tracking-widest text-[#ffd043] uppercase block mb-1 drop-shadow">
                    ✦ ${data.cardCategory}
                  </span>
                  <h4 class="font-serif-luxury text-sm sm:text-base font-bold text-white leading-snug drop-shadow-md">
                    ${data.cardTitle}
                  </h4>
                  <p class="text-[10px] font-medium text-white/75 line-clamp-1 mt-0.5">
                    ${data.cardSubtitle}
                  </p>
                </div>
              </div>
            `;

            // Clicking ANY card triggers physical expansion from that card into full screen!
            card.addEventListener('click', (e) => {
              if (isTransitioning) return;
              e.stopPropagation();
              triggerCardExpansionMorph(stepIdx, card);
              resetAutoplayTimer();
            });

            cardDeckTrack.appendChild(card);
          });
        }
      }

      function getCardStepWidth() {
        const firstCard = cardDeckTrack.querySelector('.deck-poster-card');
        if (!firstCard) return 264;
        const style = window.getComputedStyle(cardDeckTrack);
        const gap = parseFloat(style.gap) || 24;
        return firstCard.offsetWidth + gap;
      }

      // Update Track Position with Slow, Buttery Smooth 1.05s Glide
      function updateTrackPosition(animate = true) {
        const stepWidth = getCardStepWidth();
        const offset = virtualTrackIndex + 1;
        const targetX = -(offset * stepWidth);

        if (animate) {
          cardDeckTrack.style.transition = 'transform 1.05s cubic-bezier(0.2, 1, 0.28, 1)';
        } else {
          cardDeckTrack.style.transition = 'none';
        }
        cardDeckTrack.style.transform = `translateX(${targetX}px)`;
      }

      function checkTrackInfiniteLoop() {
        if (virtualTrackIndex >= total) {
          virtualTrackIndex = virtualTrackIndex % total;
          updateTrackPosition(false);
          void cardDeckTrack.offsetWidth;
        }
      }

      // 2. Initialize Progress Pills (If container present)
      function renderProgressPills() {
        if (!progressPillsContainer) return;
        progressPillsContainer.innerHTML = '';
        workflowData.forEach((_, idx) => {
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = `progress-pill-dot ${idx === currentIndex ? 'active' : ''}`;
          pill.setAttribute('aria-label', `Go to Step ${idx + 1}`);
          pill.addEventListener('click', () => {
            if (isTransitioning) return;
            triggerCardExpansionMorph(idx);
            resetAutoplayTimer();
          });
          progressPillsContainer.appendChild(pill);
        });
      }

      // 3. Masked Editorial Text Reveal Animation (Exact Video Style)
      function updateLeftEditorialContent(data) {
        const lines = [activeTitleLine1, activeTitleLine2, activeDescription];

        // Mask Slide Up Out
        lines.forEach((line) => {
          if (!line) return;
          line.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 1, 1), opacity 0.3s ease';
          line.style.transform = 'translateY(-120%)';
          line.style.opacity = '0';
        });

        setTimeout(() => {
          activeTitleLine1.textContent = data.titleLine1;
          activeTitleLine2.textContent = data.titleLine2;
          activeDescription.textContent = data.desc;

          // Prime from below
          lines.forEach((line) => {
            if (!line) return;
            line.style.transition = 'none';
            line.style.transform = 'translateY(120%)';
            line.style.opacity = '0';
          });

          void activeTitleLine1.offsetWidth; // Force reflow

          // Mask Slide Up In (Staggered & Smooth)
          if (activeTitleLine1) {
            activeTitleLine1.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s ease';
            activeTitleLine1.style.transform = 'translateY(0)';
            activeTitleLine1.style.opacity = '1';
          }

          if (activeTitleLine2) {
            activeTitleLine2.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.08s, opacity 0.85s ease 0.08s';
            activeTitleLine2.style.transform = 'translateY(0)';
            activeTitleLine2.style.opacity = '1';
          }

          if (activeDescription) {
            activeDescription.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.16s, opacity 0.85s ease 0.16s';
            activeDescription.style.transform = 'translateY(0)';
            activeDescription.style.opacity = '1';
          }
        }, 320);
      }

      // 4. Smooth Counter Flip Animation
      function updateControls(index) {
        const stepNum = workflowData[index].stepNum;

        giantCounterNum.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        giantCounterNum.style.opacity = '0';
        giantCounterNum.style.transform = 'translateY(-12px)';

        setTimeout(() => {
          giantCounterNum.textContent = stepNum;
          giantCounterNum.style.transition = 'none';
          giantCounterNum.style.transform = 'translateY(14px)';
          void giantCounterNum.offsetWidth;
          giantCounterNum.style.transition = 'opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
          giantCounterNum.style.opacity = '1';
          giantCounterNum.style.transform = 'translateY(0)';
        }, 250);

        if (progressPillsContainer) {
          const pills = progressPillsContainer.querySelectorAll('.progress-pill-dot');
          pills.forEach((pill, idx) => {
            if (idx === index) pill.classList.add('active');
            else pill.classList.remove('active');
          });
        }
      }

      // =======================================================================
      // 5. MASTER CARD-TO-BACKGROUND PHYSICAL EXPANSION MORPH
      // =======================================================================
      function triggerCardExpansionMorph(targetIndex, clickedCardEl = null) {
        if (targetIndex === currentIndex || isTransitioning) return;
        isTransitioning = true;

        const targetData = workflowData[targetIndex];
        const prevIndex = currentIndex;

        // 1. Locate the exact source card in the track
        let sourceCard = clickedCardEl;
        if (!sourceCard) {
          const cards = cardDeckTrack.querySelectorAll(`.deck-poster-card[data-step-index="${targetIndex}"]`);
          const vpLeft = cardDeckTrack.getBoundingClientRect().left;
          let best = cards[0];
          let minDiff = 999999;
          cards.forEach((c) => {
            const r = c.getBoundingClientRect();
            if (r.right > vpLeft && Math.abs(r.left - vpLeft) < minDiff) {
              minDiff = Math.abs(r.left - vpLeft);
              best = c;
            }
          });
          sourceCard = best || cards[0];
        }

        // 2. Measure Card's exact starting rectangle on screen
        const rect = sourceCard.getBoundingClientRect();

        // 3. Position the Morph Portal element at the exact card coordinates
        cardMorphImg.src = targetData.image;
        cardMorphPortal.style.transition = 'none';
        cardMorphPortal.style.display = 'block';
        cardMorphPortal.style.top = rect.top + 'px';
        cardMorphPortal.style.left = rect.left + 'px';
        cardMorphPortal.style.width = rect.width + 'px';
        cardMorphPortal.style.height = rect.height + 'px';
        cardMorphPortal.style.borderRadius = window.getComputedStyle(sourceCard).borderRadius || '24px';
        cardMorphPortal.style.boxShadow = '0 25px 60px -10px rgba(0, 0, 0, 0.85)';
        cardMorphPortal.style.opacity = '1';
        cardMorphPortal.classList.remove('expanded');

        // Lift card visually with glow
        sourceCard.classList.add('card-active-expanding');

        // 4. Update track position & advance conveyor
        let diff = targetIndex - currentIndex;
        if (diff <= 0) diff += total;
        virtualTrackIndex += diff;
        currentIndex = targetIndex;

        // Force browser layout reflow
        void cardMorphPortal.offsetWidth;

        // 5. PHYSICAL EXPANSION: Card expands from its exact rect into full screen!
        cardMorphPortal.style.transition = 
          'top 1.05s cubic-bezier(0.16, 1, 0.3, 1), ' +
          'left 1.05s cubic-bezier(0.16, 1, 0.3, 1), ' +
          'width 1.05s cubic-bezier(0.16, 1, 0.3, 1), ' +
          'height 1.05s cubic-bezier(0.16, 1, 0.3, 1), ' +
          'border-radius 1.05s cubic-bezier(0.16, 1, 0.3, 1), ' +
          'box-shadow 0.7s ease';

        cardMorphPortal.style.top = '0px';
        cardMorphPortal.style.left = '0px';
        cardMorphPortal.style.width = '100vw';
        cardMorphPortal.style.height = '100vh';
        cardMorphPortal.style.borderRadius = '0px';
        cardMorphPortal.style.boxShadow = 'none';
        cardMorphPortal.classList.add('expanded');

        // Simultaneously slide remaining cards in conveyor & update text & controls
        updateTrackPosition(true);
        updateLeftEditorialContent(targetData);
        updateControls(currentIndex);

        // Previous background slide dissolves smoothly underneath
        bgSlides.forEach((slide, sIdx) => {
          if (sIdx === prevIndex) {
            slide.classList.remove('active');
            slide.classList.add('prev-active');
          }
        });

        // 6. Seamless Handoff at end of 1.05s expansion (ZERO FLICKER)
        setTimeout(() => {
          // Pre-set target background slide to ACTIVE and full opacity BEFORE hiding morph portal!
          bgSlides.forEach((slide, sIdx) => {
            if (sIdx === targetIndex) {
              slide.style.transition = 'none';
              slide.classList.add('active');
              slide.classList.remove('prev-active');
              slide.style.opacity = '1';
              slide.style.transform = 'scale(1)';
              void slide.offsetWidth; // Force reflow
              slide.style.transition = '';
            } else {
              slide.classList.remove('active', 'prev-active');
              slide.style.opacity = '';
            }
          });

          // Reset morph portal & card glow cleanly
          sourceCard.classList.remove('card-active-expanding');
          cardMorphPortal.style.display = 'none';
          cardMorphPortal.classList.remove('expanded');

          checkTrackInfiniteLoop();
          isTransitioning = false;
        }, 1050);
      }

      function nextSlide() {
        triggerCardExpansionMorph((currentIndex + 1) % total);
      }

      function prevSlide() {
        triggerCardExpansionMorph((currentIndex - 1 + total) % total);
      }

      // Button Listeners
      if (prevSlideBtn) {
        prevSlideBtn.addEventListener('click', () => { prevSlide(); resetAutoplayTimer(); });
      }
      if (nextSlideBtn) {
        nextSlideBtn.addEventListener('click', () => { nextSlide(); resetAutoplayTimer(); });
      }

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { prevSlide(); resetAutoplayTimer(); }
        else if (e.key === 'ArrowRight') { nextSlide(); resetAutoplayTimer(); }
      });

      // 7. Autoplay Loop with Progress Bar
      function startAutoplay() {
        stopAutoplay();
        isAutoplayRunning = true;
        progressPercent = 0;

        const stepTime = 50;
        const stepInc = (stepTime / AUTOPLAY_DURATION) * 100;

        progressInterval = setInterval(() => {
          progressPercent += stepInc;
          if (autoplayProgressBar) {
            autoplayProgressBar.style.width = `${Math.min(progressPercent, 100)}%`;
          }
          if (progressPercent >= 100) {
            progressPercent = 0;
            nextSlide();
          }
        }, stepTime);
      }

      function stopAutoplay() {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
        if (autoplayProgressBar) {
          autoplayProgressBar.style.width = '0%';
        }
      }

      function resetAutoplayTimer() {
        if (!isAutoplayRunning) return;
        startAutoplay();
      }

      // Pause on Hover
      const mainStage = document.querySelector('.globe-main-stage');
      if (mainStage) {
        mainStage.addEventListener('mouseenter', () => { if (isAutoplayRunning) stopAutoplay(); });
        mainStage.addEventListener('mouseleave', () => { if (isAutoplayRunning) startAutoplay(); });
      }

      // Handle Window Resize
      window.addEventListener('resize', () => {
        updateTrackPosition(false);
      });

      // Touch Swipe on Card Deck
      let touchStartX = 0;
      cardDeckTrack.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      cardDeckTrack.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(diffX) > 45) {
          if (diffX < 0) nextSlide();
          else prevSlide();
          resetAutoplayTimer();
        }
      }, { passive: true });

      // Initial Mount
      buildContinuousTrack();
      renderProgressPills();
      updateTrackPosition(false);
      updateControls(0);
      startAutoplay();
    })();
  </script>
</body>
